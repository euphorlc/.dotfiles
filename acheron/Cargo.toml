[package]
name = "acheron"
version = "0.2.0"
edition = "2024"
description = "A themed Distrobox workspace manager"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"

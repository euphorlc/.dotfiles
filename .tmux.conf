# Remap prefix to ctrl + a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Set split panes bindings
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Enable mouse
set -g mouse on

# Keybinding for config file reload
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Start panes at index 1
set -g base-index 1
set -g pane-base-index 1

set -g history-limit 10000
set -g default-terminal "screen-256color"

# OS-specific theme routing
if-shell 'grep -qi "kali" /etc/os-release' 'source-file ~/.tmux_theme_ares.conf'
if-shell 'grep -qi "ubuntu" /etc/os-release' 'source-file ~/.tmux_theme_hephaestus.conf'

# TPM plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Essential plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

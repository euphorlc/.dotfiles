# ~/.dotfiles/.tmux.conf

# Remap prefix to ctrl + a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Set split panes bindings
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Enable mouse
set -g mouse on

# Keybinding for config file reload
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Start panes at index 1
set -g base-index 1
set -g pane-base-index 1

set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -ag update-environment " WORKSPACE_THEME"
set-hook -g client-attached 'source-file ~/.tmux.conf'

# ─── Workspace-specific theme routing ──────────────────────────────────────
# Uses WORKSPACE_THEME exported by Fish from Acheron workspace metadata.
if-shell '[ "$WORKSPACE_THEME" = "mars" ]' \
  'source-file ~/.tmux_theme_mars.conf'
if-shell '[ "$WORKSPACE_THEME" = "vulcan" ]' \
  'source-file ~/.tmux_theme_vulcan.conf'
# If WORKSPACE_THEME is unset or has other value, load nothing (uses default tmux colors)

# ─── TPM plugin manager ──────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Essential plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @continuum-restore 'on'

# Initialize TPM (put this at the very bottom)
# Plugins are preinstalled in workspace images. Rebuild the image to update.
if-shell 'test -x /usr/local/share/acheron/tmux/plugins/tpm/tpm' \
  'set-environment -g TMUX_PLUGIN_MANAGER_PATH /usr/local/share/acheron/tmux/plugins/; run-shell /usr/local/share/acheron/tmux/plugins/tpm/tpm'

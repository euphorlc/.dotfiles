# ~/.dotfiles/distrobox.ini

[vulcan]
image=registry.fedoraproject.org/fedora:41
additional_flags="--env WORKSPACE_THEME=vulcan"
additional_packages="git fish tmux stow gcc gcc-c++ make python3-devel"
init_hooks="curl -sS https://starship.rs/install.sh | sh -s -- -y; chsh -s /usr/bin/fish"

[mars]
image=registry.fedoraproject.org/fedora:41
additional_flags="--env WORKSPACE_THEME=mars"
additional_packages="git fish tmux stow nmap python3-pip"
init_hooks="curl -sS https://starship.rs/install.sh | sh -s -- -y; chsh -s /usr/bin/fish"

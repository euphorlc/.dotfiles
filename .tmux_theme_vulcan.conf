# ~/.tmux_theme_vulcan.conf

# Status bar colors
set -g status-style bg="#1C2638",fg="#DAF2E9"

# Pane border colors
set -g pane-border-style fg="#23495D"
set -g pane-active-border-style fg="#95E0CC"

# Message/command line colors
set -g message-style bg="#95E0CC",fg="#1C2638",bold

# Left status (session name with powerline transition)
set -g status-left-length 40
set -g status-left "#[bg=#95E0CC,fg=#1C2638,bold] ⚡ #S #[bg=#1C2638,fg=#95E0CC] "

# Window status format
set -g window-status-format "#[fg=#39707A,bg=#1C2638] #I: #W "
set -g window-status-current-format "#[bg=#F14E52,fg=#DAF2E9,bold] #I: #W "

# Right status (date and time)
set -g status-right "#[bg=#23495D,fg=#DAF2E9] %Y-%m-%d #[bg=#39707A,fg=#DAF2E9,bold] %H:%M "

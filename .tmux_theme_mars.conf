# ~/.tmux_theme_mars.conf

# Status bar colors
set -g status-style bg="#072620",fg="#94ADAA"

# Pane border colors
set -g pane-border-style fg="#380D00"
set -g pane-active-border-style fg="#F25C05"

# Message/command line colors
set -g message-style bg="#F25C05",fg="#072620",bold

# Left status (session name)
set -g status-left-length 40
set -g status-left "#[bg=#F25C05,fg=#072620,bold] ⚷ #S #[bg=#072620,fg=#F25C05] "

# Window status format (matching the starship bracket aesthetic)
set -g window-status-format "#[fg=#94ADAA] #I: #W "
set -g window-status-current-format "#[fg=#F2B705,bold] [ #I: #W ] "

# Right status (date and time)
set -g status-right "#[fg=#F28705] %Y-%m-%d #[fg=#F2B705] %H:%M "
